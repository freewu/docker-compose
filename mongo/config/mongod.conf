# mongod.conf

# for documentation of all options, see:
#   http://docs.mongodb.org/manual/reference/configuration-options/

# Where and how to store data.
storage:
  dbPath: /data/db
  # 注意：**不要写 storage.journal.enabled**。这是 4.0 之前用来关 journal 的开关，WiredTiger 从 4.0 起
  #       就不允许关 journal，这个选项在 6.1 / 7.0 起被移除；写了它 mongod 会直接报错退出（不是告警）：
  #         Unrecognized option: storage.journal.enabled
  #         try 'mongod --help' for more information
  #       journaling 一直是开着的，不需要（也没法）配置。
  #       下面这些选项已用 7.0.43 / 8.0.32 / 8.3.11 三个版本的 mongod 实测过，都能正常启动。
  directoryPerDB: true
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1
      directoryForIndexes: true

# where to write logging data.
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

# network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0

# how the process runs
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# ---- 副本集（默认关闭；需要多文档事务时再打开，见 Readme「单节点副本集」）----
# 为什么默认不开：只要 .env 里设了 MONGO_INITDB_ROOT_*，镜像入口脚本就会给 mongod 自动追加 --auth；
# 而「开了鉴权 + 声明了副本集」时 MongoDB 强制要求内部认证，必须同时提供 security.keyFile，
# 否则 mongod 启动直接失败（7.0 / 8.0 / 8.3 实测，见 Readme 常见问题 16）：
#   BadValue: security.keyFile is required when authorization is enabled with replica sets
#
#replication:
#  oplogSizeMB: 51200
#  replSetName: rs0
#
# 开副本集时必须同时配上 keyFile（文件里 6~1024 字节随机内容，权限必须是 400/600，否则拒绝启动）：
#security:
#  keyFile: /etc/mongo-key/keyfile
