# mongod.conf

# for documentation of all options, see:
#   http://docs.mongodb.org/manual/reference/configuration-options/

# Where and how to store data.
storage:
  dbPath: /data/db
  journal:
    enabled: true
  directoryPerDB: true
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1
      directoryForIndexes: true

# where to write logging data.
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

# network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0

# how the process runs
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

#replication:
# 注意：这里只是"声明"副本集名，副本集还没就绪，需要手动 rs.initiate() 一次（见 Readme「单节点副本集」/ 常见问题 7）
#      不需要副本集 / 多文档事务的话，把下面两行删掉、清空数据目录重启即可（见 Readme 常见问题 11）
replication:
   oplogSizeMB: 51200
   replSetName: rs0
