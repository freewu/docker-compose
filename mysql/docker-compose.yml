services:
  mysql:
    image: mysql:8.4.11
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    ports:
      - 3306:3306
    volumes:
      - /data/mysql/mydir:/mydir
      - /data/mysql/datadir:/var/lib/mysql
      # 放到 conf.d 下，保留镜像自带 /etc/my.cnf 的 datadir/socket/pid-file 等配置
      - ./config/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # 数据库还原目录，可将需要还原的sql文件放在这里
      - /data/mysql/source:/docker-entrypoint-initdb.d
    healthcheck:
      # mysqladmin ping 无需密码：服务在跑即返回 0
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
