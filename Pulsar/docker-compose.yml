# Pulsar standalone 单机版（broker + 本地 BookKeeper bookie + Functions worker 都在一个进程里）
#
# 使用到的端口（宿主机映射；容器内都是 Pulsar 默认端口）：
#   6650  broker 二进制协议（客户端默认连这个，Java/Python/Go SDK 都用它）
#   8085  HTTP 服务，一个端口同时提供：Admin REST API + WebSocket + 健康检查
#         （容器内是默认的 8080，宿主机侧改成 8085，避开已占用 8080 的 nacos）
#
# 容器内监听、但默认不映射的端口（都是内部用的，一般不需要暴露到宿主机）：
#   3181  本地 BookKeeper bookie 端口（消息真正的存储在这）
#   6750  Functions worker（standalone 默认开启，和 broker 同进程）
#
# 数据目录（宿主机）：
#   /data/pulsar/data   元数据（data/metadata，RocksDB）、bookie 数据（data/standalone/bookkeeper）
#   /data/pulsar/logs   pulsar-standalone.log、GC 日志、bookkeeper/函数运行时日志
#
# 注意：--advertised-address 取同目录 .env 里的 HOST_IP（broker 通告给客户端的连接地址），
#   填错会出现「能连上 broker，但生产/消费时 lookup 到 localhost → Connection refused」。
services:
  pulsar:
    image: apachepulsar/pulsar:${PULSAR_VERSION:-4.2.4}
    container_name: pulsar
    restart: always
    # 镜像默认用 uid 10000 跑，而 /data/pulsar/* 是 Docker 以 root 建的（755），非 root 写不进去 → 这里用 root 跑。
    # 想按镜像默认的非 root 跑：先 sudo chown -R 10000:0 /data/pulsar，再删掉这一行（见 Readme 常见问题 3）。
    user: "0:0"
    ports:
      - 6650:6650
      - 8085:8080
    environment:
      - TZ=Asia/Shanghai
      - PULSAR_MEM=${PULSAR_MEM:--Xms512m -Xmx1g -XX:MaxDirectMemorySize=1g}
    # standalone 必须自己指定启动命令（镜像的 CMD 是 /bin/sh）
    command:
      - bin/pulsar
      - standalone
      - --advertised-address
      - ${HOST_IP:?请在 Pulsar/.env 中配置 HOST_IP（宿主机局域网 IP，例如 192.168.110.141）}
    volumes:
      - /data/pulsar/data:/pulsar/data
      - /data/pulsar/logs:/pulsar/logs
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      # Pulsar 自带的 broker 健康检查接口（等价于 pulsar-admin brokers healthcheck）
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/admin/v2/brokers/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
