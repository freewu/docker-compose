# RocketMQ Broker 配置模板（name = value 格式；# 开头是注释）
#
# 这个文件是「模板」，被只读挂载到容器内 /home/rocketmq/conf-template/broker.conf；
# broker 启动时会把下面的 @HOST_IP@ 替换成同目录 .env 里的 HOST_IP，
# 渲染结果写到容器内 /home/rocketmq/broker.conf，再执行：
#   sh mqbroker -n namesrv:9876 -c /home/rocketmq/broker.conf
# 所以：改完本文件要重建 broker 容器才生效
#   docker compose up -d --force-recreate broker

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 对外通告地址：必须能被「宿主机上的客户端」访问到，所以用宿主机局域网 IP
# （不能写 127.0.0.1、也不能写容器 IP/容器名 —— 那样只有同网络里的容器能连上）
# 由 compose 从 .env 的 HOST_IP 注入，探测：../redis-cluster/set-host-ip.sh --print
brokerIP1 = @HOST_IP@

# 单机主节点：brokerId = 0 即 master，没有从节点，所以用异步复制角色
brokerRole = ASYNC_MASTER

# 异步刷盘：开发环境吞吐好，机器掉电可能丢少量消息；要求不丢消息改成 SYNC_FLUSH
flushDiskType = ASYNC_FLUSH

# 过期文件清理时间：凌晨 4 点清理一次，文件保留 48 小时（开发环境可调小，如 12）
deleteWhen = 04
fileReservedTime = 48

# 自动创建 Topic：发消息时遇到不存在的 topic 自动建（开发方便）
# 生产环境建议改成 false，改由运维/控制台统一建 Topic（分区数可控）
autoCreateTopicEnable = true

# 其它按需打开的参数（保持默认时不用写）：
#   刷盘/发送超时、消费队列数等
#   defaultTopicQueueNums = 4
#   主从同步（有从节点时才用）：brokerIP2 = <从节点可访问的地址>
#   5.x 的 gRPC 代理（要用 rocketmq-client-java 等 gRPC 客户端时打开，并把 compose 里的 8081 端口映射出来）
#   enableProxy = true
