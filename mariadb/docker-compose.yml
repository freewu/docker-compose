version: '3.5'

services:
  mariadb:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: test
    ports:
      - "3307:3306"
    volumes:
      # Compose knows how to interpret relative paths;
      # they are relative to the location of the docker-compose.yml file
      - /data/mariadb:/var/lib/mysql
